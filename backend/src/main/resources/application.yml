spring:
  application:
    name: teacher-transfer
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/teachertransfer}
    username: ${DATABASE_USERNAME:teachertransfer}
    password: ${DATABASE_PASSWORD:teacherpass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  
  mail:
    host: ${SMTP_HOST:smtp.sendgrid.net}
    port: ${SMTP_PORT:587}
    username: ${SENDGRID_API_KEY}
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Application configuration
app:
  name: ${APP_NAME:TeacherTransfer}
  domain: ${APP_DOMAIN:teachertransfer.in}
  environment: ${APP_ENV:development}
  
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-characters-long}
    expiry-hours: ${JWT_EXPIRY_HOURS:168}
  
  # OTP Configuration
  otp:
    provider: ${OTP_PROVIDER:msg91}
    expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
  
  # MSG91 Configuration
  msg91:
    auth-key: ${MSG91_AUTH_KEY:}
    sender-id: ${MSG91_SENDER_ID:TCHTRN}
    template-id: ${MSG91_TEMPLATE_ID:}
  
  # Razorpay Configuration
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  
  # Geohash Configuration
  geohash:
    precision: ${GEOHASH_PRECISION:6}
  
  # Ghost User Configuration
  ghost:
    inactive-days: ${GHOST_INACTIVE_DAYS:14}
  
  # Matching Configuration
  matching:
    max-results: ${MATCHING_MAX_RESULTS:50}
    max-hop-count: ${MATCHING_MAX_HOP_COUNT:3}
    batch-timeout-ms: ${MATCHING_BATCH_TIMEOUT_MS:100}

# Logging
logging:
  level:
    com.teachertransfer: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
